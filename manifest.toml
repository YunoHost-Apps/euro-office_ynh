#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "euro-office"
name = "Euro-Office"
description.en = "Create and edit documents collaboratively"
description.fr = "Créez et éditer des documents collaborativement"

version = "9.3.5~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/Euro-Office/DocumentServer"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "2400M"
ram.build = "200M"
ram.runtime = "2000M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/eurooffice"

    [install.init_main_permission]
    help.en = "You must activate 'Visitors' if you want to connect Nextcloud client to Eur-Office server. This can be changed later via the webadmin."
    help.fr = "Vous devez activer 'Visiteurs' si vous souhaitez connecter le client Nextcloud au serveur euro-Office. Cela peut être modifié ultérieurement via l'administrateur Web."
    type = "group"
    default = "visitors"

    [install.allowed_urls]
    ask.en = "List of web addresses authorized to integrate Euro-Office editor, separated by space"
    ask.fr = "Liste des adresses web autorisées à intégrer l'éditeur Euro-Office, séparées par un espace"
    type = "string"
    example = "https://domain.tld/nextcloud https://nextcloud.domain.tld"
    
[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/Euro-Office/DocumentServer/releases/download/v9.3.5/euro-office-documentserver_9.3.5-0_amd64.deb"
    amd64.sha256 = "2c14ce8eabcf58bd4d6e56ca7304d565de48e6867f4bbd31ef41a9bacfcbaa13"
    arm64.url = "https://github.com/Euro-Office/DocumentServer/releases/download/v9.3.5/euro-office-documentserver_9.3.5-0_arm64.deb"
    arm64.sha256 = "a9ae23a193a64c19ff3a005515e8c148528418766857b099caeb7655fd6e0110"
    extract = false
    rename = "euro-office-documentserver.deb"
    autoupdate.asset.amd64 = ".*amd64.deb$"
    autoupdate.asset.arm64 = ".*arm64.deb$"
    autoupdate.strategy = "latest_github_release"
        
#    [resources.sources.fonts]
#    url = "https://forge.liiib.re/indiehost/libre.sh/fonts/-/archive/4f5ad93ee65a862bddfc70eb48ac98e531968da7/fonts-4f5ad93ee65a862bddfc70eb48ac98e531968da7.tar.gz"
#    sha256 = "aed831e465bf775320a6298a5a7aac0197754de410f736c1020996267678016f"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:rx"

    [resources.data_dir]
    subdirs = ['docbuilder', 'cache/files']
    group = "www-data:rx"

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = [
        "postgresql",
        "postgresql-contrib",
        "libstdc++6",
        "rabbitmq-server",
        "redis",
        "redis-tools",
        "libcurl4-openssl-dev",
        "binutils",
        #"ttf-mscorefonts-installer",
    ]

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
