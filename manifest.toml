#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "euro-office"
name = "Euro-Office"
description.en = "Create and edit documents collaboratively"
description.fr = "Créez et éditer des documents collaborativement"

version = "9.3.2~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-or-later"
#website = "https://www.onlyoffice.com"
#demo = "https://www.onlyoffice.com/fr/download-desktop.aspx"
code = "https://github.com/Euro-Office/DocumentServer"
#cpe = "cpe:2.3:a:onlyoffice:document_server"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "2100M"
ram.build = "800M"
ram.runtime = "800M"

[antifeatures]
arbitrary-limitations.en = "The official Euro-Office build limits the number of users and open documents. This package recompiles this part according to the AGPLv3 licence, removing these artificial limitations."
arbitrary-limitations.fr = "La version officielle d'Euro-Office limite le nombre d'utilisateurs et de documents ouverts. Ce paquet recompile cette partie conformément à la licence AGPLv3, supprimant ainsi ces limitations artificielles."

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    help.en = "You will only be able to connect Euro-Office to your app if both apps are public!"
    help.fr = "Votre app et Euro-Office doivent être des applications publiques si vous voulez les connecter !"
    type = "group"
    default = "visitors"

    [install.allowed_urls]
    ask.en = "List of web addresses authorized to integrate the Euro-Office editor separated by space"
    ask.fr = "Liste des adresses web autorisées à intégrer l'éditeur Euro-Office séparées par un espace"
    help.en = "Install the Euro-Office connector to edit documents from Nextcloud."
    help.fr = "Installez le connecteur Euro-Office pour éditer des documents dans Nextcloud."
    type = "string"
    example = "https://cloud.yunohost.domain/nextcloud https://example.com"
    
    [install.reject_unauthorized]
    ask.en = "Prevent integration with an app that is not authenticated by a valid certificate (example: Let's Encrypt)"
    ask.fr = "Empécher l'intégration avec une app non authentifiée par un certificat valide (exemple : Let's Encrypt)"
    type = "boolean"
    default = true
    yes = true
    no = false
    help.en = "Disabling this option allows Euro-Office to accept unauthenticated HTTPS requests, which can be useful if your server is not exposed to the internet and cannot obtain a Let's Encrypt certificate."
    help.fr = "Désactiver cette option permet à Euro-Office d'accepter les requêtes HTTPS non authentifiées, ce qui peut être utile si votre serveur n'est pas exposé sur internet et ne peut pas obtenir de certificat Let's Encrypt."
    
    [install.rebuild_without_limitations]
    ask.en = "Remove usage limitations by replacing official Euro-Office binaries"
    ask.fr = "Supprimer les limites d'usage en remplaçant les binaires officiels d'Euro-Office"
    type = "boolean"
    default = 1
    help.en = "Recompile binaries in order to remove usage limitations (number of users, opened documents, smartphone usage). Note: the install and upgrade will be slower."
    help.fr = "Recompile les binaires afin de supprimer les limitations d'utilisation (nombre d'utilisateurs, documents ouverts, utilisation sur smartphone)."

[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/Euro-Office/DocumentServer/releases/download/v9.3.2/euro-office-documentserver_9.3.1-dev.1_amd64.deb"
    amd64.sha256 = "742516fedaeddc52072881c3fe60dcb046db1b1cbdd0a674cda8dd1e4502d380"
    arm64.url = "https://github.com/Euro-Office/DocumentServer/releases/download/v9.3.2/euro-office-documentserver_9.3.1-dev.1_arm64.deb"
    arm64.sha256 = "d548741bc7af52ada79ef9ecbda92fcff5383d5fa66e63769e179fac9f2851b7"
    extract = false
    rename = "euro-office-documentserver.deb"
    autoupdate.asset.amd64 = "^euro-office-documentserver_amd64.deb$"
    autoupdate.asset.arm64 = "^euro-office-documentserver_arm64.deb$"
    autoupdate.strategy = "latest_github_release"
    
[resources.sources.src]
    url = "https://github.com/Euro-Office/server/archive/refs/tags/v9.3.2.tar.gz"
    sha256 = "4f18fa2c183c6a53e344a6d0be0bd5fbd7428becca9d3a3a6c7e6ed41e26bb02"
    # Autoupdater disabled because keeps failing everyday, because no tag found after sanity filtering
    # autoupdate.strategy = "latest_github_tag"
    # autoupdate.version_regex = "^v9.*$"
    # autoupdate.upstream = "https://github.com/ONLYOFFICE/server"
    
#    [resources.sources.fonts]
#    url = "https://forge.liiib.re/indiehost/libre.sh/fonts/-/archive/4f5ad93ee65a862bddfc70eb48ac98e531968da7/fonts-4f5ad93ee65a862bddfc70eb48ac98e531968da7.tar.gz"
#    sha256 = "aed831e465bf775320a6298a5a7aac0197754de410f736c1020996267678016f"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:rx"

    [resources.data_dir]
    subdirs = ['docbuilder', 'cache/files']
    group = "www-data:rx"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8095

    [resources.apt]
    packages = [
        "postgresql",
        "postgresql-contrib",
        "libstdc++6",
        "rabbitmq-server",
        "redis",
        "redis-tools",
        "libcurl4-openssl-dev",
        "binutils",
        #"ttf-mscorefonts-installer",
    ]

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "18"
