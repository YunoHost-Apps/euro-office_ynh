version = "1.0"

[main]

[main.integration]
name.en = "Integration"
name.fr = "Intégration"
services = ["nginx", "__APP__-docservice"]

	[main.integration.allowed_urls]
	ask.en = "The domain of your Nextcloud instance"
	ask.fr = "Le domain de votre instance Nextcloud"
	help.en = "List of web addresses authorized to integrate Euro-Office editor separated by space."
	help.fr = "Liste des adresses web autorisées à intégrer l'éditeur Euro-Office séparées par un espace."
	type = "string"
	example = "https://nextcloud.domain.tld https://domain.tld/nextcloud"

	[main.integration.reject_unauthorized]
	ask.en = "Prevent unauthenticated requests"
	ask.fr = "Empécher les requêtes non authentifiées"
	type = "boolean"
	yes = true
	no = false
	help.en = "In most cases, you should keep this option activated. However, disabling it allows Euro-Office to accept unauthenticated HTTPS requests, which can be useful if your server is not connected to the internet and cannot obtain a Let's Encrypt certificate."
	help.fr = "En général, vous devriez laisser cette option activée. Désactiver cette option permet à Euro-Office d'accepter les requêtes HTTPS non authentifiées, ce qui peut être utile si votre serveur n'est pas exposé sur internet et ne peut pas obtenir de certificat Let's Encrypt."
	bind = "rejectUnauthorized:__INSTALL_DIR__/config/local.json"

[main.auto_assembly]
name.en = "Automatic saving"
name.fr = "Sauvegarde automatique"
services = ["__APP__-docservice"]

	[main.auto_assembly.autoassembly_enable]
	ask.en = "Enable automatic saving"
	ask.fr = "Activer la sauvegarde automatique"
	type = "boolean"
	yes = true
	no = false
	bind = "autoAssembly>enable:__INSTALL_DIR__/config/local.json"
	help.en = "Automatic forcesaving will only be initiated after some changes were made to the document. The empty versions will not be forcesaved automatically. Additionally, file versioning needs to be implemented on the document management system's side for this parameter to work."
	help.fr = "La sauvegarde automatique forcée ne sera déclenchée qu'après l'apport de modifications au document. Les versions vides ne feront pas l'objet d'une sauvegarde automatique forcée. Par ailleurs, pour que ce paramètre fonctionne, la gestion des versions de fichiers doit être implémentée côté système de gestion documentaire."

	[main.auto_assembly.autoassembly_interval]
	ask.en = "Interval time in minutes"
	ask.fr = "Durée de l'intervalle en minutes"
	type = "string"
	bind = "autoAssembly>interval:__INSTALL_DIR__/config/local.json"
	help.en = "Defines the interval time in minutes for initiating the automatic forcesaving."
	help.fr = "Définit l'intervalle de temps, en minutes, pour déclencher la sauvegarde forcée automatique."
	example = "5m"
	pattern.regexp = '^\d+m$'
	pattern.error = "Provide a value in minutes like '5m'"

	[main.auto_assembly.autoassembly_step]
	ask.en = "Delay in minutes between the intervals"
	ask.fr = "Délai en minutes entre les intervalles"
	type = "string"
	bind = "autoAssembly>step:__INSTALL_DIR__/config/local.json"
	example = "1m"
	pattern.regexp = '^\d+m$'
	pattern.error = "Provide a value in minutes like '1m'"
